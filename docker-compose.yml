name: ticketflow

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: ticketflow-frontend:local
    restart: unless-stopped
    init: true
    ports:
      - "${FRONTEND_PORT:-80}:8080"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Nginx needs these capabilities to prepare its cache directories and worker user.
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/nginx-health || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    mem_limit: 128m
    cpus: 0.50

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ticketflow-backend:local
    restart: unless-stopped
    init: true
    env_file:
      - ./backend/.env
    environment:
      FLASK_ENV: production
      FLASK_DEBUG: "0"
      PORT: "5000"
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
    expose:
      - "5000"
    networks:
      - app-network
      - database-network
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    mem_limit: 256m
    cpus: 1.00

networks:
  app-network:
    driver: bridge
    internal: true
  database-network:
    name: ${DATABASE_NETWORK:-ticketflow-net}
    external: true
